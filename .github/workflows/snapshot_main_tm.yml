name: "Snapshot (main_tm)"

# Automatic development builds for the fork's "main_tm" branch.
#
# Same idea as upstream's "Snapshot" workflow on "main", except:
#   - it triggers on "main_tm" only, so upstream's "main" is never touched;
#   - only the latest build is kept: artifacts of previous runs are dropped and
#     the zip is published to the rolling "main_tm-latest" pre-release, marked
#     as a pre-release ("Development Build (main_tm)").

on:
  push:
    branches: [ "main_tm" ]
    paths-ignore:
      - 'src/i18n/*'
      - 'src/icons/*'
      - 'src/resources.qrc'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      APPNAME: ${{ steps.meta.outputs.APPNAME }}
      VERSION: ${{ steps.meta.outputs.VERSION }}
      REVISION: ${{ steps.meta.outputs.REVISION }}
      SHA_SHORT: ${{ steps.meta.outputs.SHA_SHORT }}
      PACKAGENAME: ${{ steps.meta.outputs.PACKAGENAME }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Meta
      id: meta
      run: |
        APPNAME="${GITHUB_REPOSITORY#*/}"
        VERSION=$(git tag --sort=v:refname | grep -oE "(^[0-9]+(\.[0-9]+)*)$" | tail -1)
        if [ -z "$VERSION" ]; then
          VERSION="0.0"
          REVISION=$(git rev-list HEAD --count)
        else
          REVISION=$(git rev-list "$VERSION"..HEAD --count)
        fi
        SHA_SHORT=$(git rev-parse --short HEAD)
        echo "APPNAME=$APPNAME" >> "$GITHUB_OUTPUT"
        echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
        echo "REVISION=$REVISION" >> "$GITHUB_OUTPUT"
        echo "SHA_SHORT=$SHA_SHORT" >> "$GITHUB_OUTPUT"
        echo "PACKAGENAME=$APPNAME-$VERSION.$REVISION-${GITHUB_REF_NAME}-$SHA_SHORT" >> "$GITHUB_OUTPUT"
        echo "Building $APPNAME $VERSION.$REVISION ($GITHUB_REF_NAME @ $SHA_SHORT)"

  windows:
    name: Windows build
    needs: version
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
    - name: drop artifacts of previous runs
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --paginate \
          --jq ".artifacts[] | select(.expired == false and .workflow_run.id != ${{ github.run_id }}) | .id" |
        while read -r id; do
          echo "Dropping stale artifact $id"
          gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
        done
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install pyinstaller pyinstaller-versionfile
    - name: Create versionfile
      run: |
        touch metadata.yml
        echo "FileDescription: ${{ needs.version.outputs.APPNAME }}" >> metadata.yml
        echo "InternalName: ${{ needs.version.outputs.APPNAME }}" >> metadata.yml
        create-version-file metadata.yml --outfile versionfile.txt --version ${{ needs.version.outputs.VERSION }}.0.${{ needs.version.outputs.REVISION }}
    - name: build
      env:
        PYTHONOPTIMIZE: "1"
      run: pyinstaller image-editor.spec
    - name: install libgphoto2 runtime
      run: C:\msys64\usr\bin\bash.exe -lc "pacman -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-libgphoto2"
    - name: bundle libgphoto2
      run: python misc/bundle_gphoto2.py dist/${{ needs.version.outputs.APPNAME }}
    - name: test libgphoto2 bundle
      run: python misc/test_gphoto2_bundle.py dist/${{ needs.version.outputs.APPNAME }}
    - name: package
      run: |
        cd dist
        dir ${{ needs.version.outputs.APPNAME }}
        7z a -r ${{ needs.version.outputs.PACKAGENAME }}.zip ${{ needs.version.outputs.APPNAME }}
        move ${{ needs.version.outputs.PACKAGENAME }}.zip ..
        cd ..
    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ needs.version.outputs.PACKAGENAME }}
        path: ${{ needs.version.outputs.PACKAGENAME }}.zip
        if-no-files-found: error

  publish:
    name: Publish latest build
    needs: [version, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.version.outputs.PACKAGENAME }}
        path: artifacts
    - name: Release notes
      run: |
        {
          echo "Rolling development build of branch \`main_tm\`. Only the latest build is kept."
          echo
          echo "- Commit: \`${{ github.sha }}\`"
          echo "- Version: ${{ needs.version.outputs.VERSION }}.${{ needs.version.outputs.REVISION }}"
          echo "- Built: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "- Package: \`${{ needs.version.outputs.PACKAGENAME }}.zip\`"
        } > notes.md
    - name: release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        tag="main_tm-latest"
        if gh release view "$tag" >/dev/null 2>&1; then
          gh release delete "$tag" --yes --cleanup-tag
        fi
        gh release create "$tag" "artifacts/${{ needs.version.outputs.PACKAGENAME }}.zip" \
          --prerelease \
          --title "Development Build (main_tm)" \
          --target "$GITHUB_SHA" \
          --notes-file notes.md
